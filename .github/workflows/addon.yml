name: Build add-on

on:
  push:
    branches: [main]
    paths:
      - "addon/**"
      - ".github/workflows/addon.yml"
  pull_request:
    paths:
      - "addon/**"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, amd64]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: home-assistant/builder@master
        with:
          args: |
            --test \
            --${{ matrix.arch }} \
            --target /data/addon/eldat_easywave_bridge
