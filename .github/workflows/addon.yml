name: Build add-on

on:
  push:
    branches: [main]
    paths:
      - "addon/**"
      - ".github/workflows/addon.yml"
  pull_request:
    paths:
      - "addon/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The add-on ships no prebuilt image: config.yaml has no `image:` key, so
      # the Supervisor builds it locally on the Home Assistant machine. Nothing
      # is published here -- this job only proves the Dockerfile still builds,
      # which is otherwise discovered on the user's box at install time.
      - name: Build the add-on image
        uses: docker/build-push-action@v6
        with:
          context: addon/eldat_easywave_bridge
          push: false
          load: true
          tags: eldat-easywave-bridge:ci
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/amd64-base:3.21

      - name: Check the bridge starts and fails cleanly
        run: |
          # A CI container has no /dev/bus/usb, so libusb_init() cannot succeed.
          # The point is that this is reported as a clear, actionable message
          # rather than a traceback -- reaching it exercises the imports, the
          # libusb load and the option parsing.
          output=$(docker run --rm eldat-easywave-bridge:ci python3 -m bridge 2>&1 || true)
          echo "${output}"
          if echo "${output}" | grep -q "Traceback"; then
            echo "::error::the bridge crashed instead of reporting an error"
            exit 1
          fi
          echo "${output}" | grep -qE "cannot reach the USB subsystem|no ELDAT transceiver found" \
            || { echo "::error::unexpected startup output"; exit 1; }
